<!DOCTYPE html>
<html>
<body>

  <h1>Ethereum</h1>

  <input id="carteira" placeholder="Digite um endereço Ethereum" size="50">

  <p>Bloco: <b id="bloco">—</b></p>
  <p>Saldo: <b id="saldo">—</b></p>

  <button onclick="buscar()">Buscar</button>

  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script>
    var web3 = new Web3("https://ethereum.publicnode.com");

    async function buscar() {
      var carteira = document.getElementById("carteira").value;

      try {
        var bloco = await web3.eth.getBlockNumber();
        document.getElementById("bloco").innerText = bloco;

        var wei = await web3.eth.getBalance(carteira);
        var eth = web3.utils.fromWei(wei, "ether");

        document.getElementById("saldo").innerText = eth + " ETH";
      } catch (e) {
        document.getElementById("saldo").innerText = "Erro ao consultar";
      }
    }
  </script>

</body>
</html>
